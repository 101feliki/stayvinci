# Render Blueprint: the whole Stayvinci system on Render (onrender.com addresses, no custom domain yet).
#   stayvinci            main website          https://stayvinci.onrender.com
#   stayvinci-app        guest app (web)       https://stayvinci-app.onrender.com
#   stayvinci-business   business app          https://stayvinci-business.onrender.com
#   stayvinci-console    staff console         https://stayvinci-console.onrender.com
#   stayvinci-api        API                   https://stayvinci-api.onrender.com
#   stayvinci-db         PostgreSQL 16
# Secrets are generated by Render or entered in the dashboard (sync: false); none live in this file.
# Redis is not used yet; add a Key Value instance when the BullMQ workers start doing work.
#
# Free tier for now:
#  - The API sleeps after 15 minutes without traffic. An uptime monitor pings /health/live every
#    5 minutes to keep it awake (one service awake all month fits the 750 free hours).
#  - The free database expires 30 days after creation; upgrade it (keeps the data) before then.
#  - Free services have no pre-deploy step, so the API applies migrations itself on start.

databases:
  - name: stayvinci-db
    databaseName: stayvinci
    user: stayvinci
    postgresMajorVersion: '16'
    plan: free
    region: frankfurt
    ipAllowList: [] # only Render services can connect

services:
  - type: web
    name: stayvinci-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@stayvinci/api...
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: MIGRATE_ON_START
        value: 'true'
      - key: TRUST_PROXY
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: stayvinci-db
          property: connectionString
      - key: PUBLIC_API_URL
        value: https://stayvinci-api.onrender.com
      - key: CORS_ORIGINS
        value: https://stayvinci.onrender.com,https://stayvinci-app.onrender.com,https://stayvinci-business.onrender.com,https://stayvinci-console.onrender.com
      - key: GUEST_APP_URL
        value: https://stayvinci-app.onrender.com
      - key: BUSINESS_APP_URL
        value: https://stayvinci-business.onrender.com
      - key: CONSOLE_URL
        value: https://stayvinci-console.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true # 32 random bytes, base64
      - key: DOCS_ENABLED
        value: 'false'
      - key: SMS_PROVIDER
        value: 'off'
      - key: MAIL_TRANSPORT
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_SECURE
        value: 'true'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: stayvinci
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@stayvinci/website...
    staticPublishPath: apps/website/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        value: https://stayvinci-api.onrender.com
      - key: VITE_GUEST_APP_URL
        value: https://stayvinci-app.onrender.com
      - key: VITE_BUSINESS_APP_URL
        value: https://stayvinci-business.onrender.com

  - type: web
    name: stayvinci-app
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@stayvinci/guest-web...
    staticPublishPath: apps/guest-web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        value: https://stayvinci-api.onrender.com

  - type: web
    name: stayvinci-business
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@stayvinci/business-web...
    staticPublishPath: apps/business-web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        value: https://stayvinci-api.onrender.com

  - type: web
    name: stayvinci-console
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@stayvinci/admin-console...
    staticPublishPath: apps/admin-console/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        value: https://stayvinci-api.onrender.com
